services:
  # ⚙️ Backend API
  - type: web
    name: ead-bpo-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ead-bpo-db
          property: connectionString

  # 🖥️ Torre de Control Web Dashboard
  - type: web
    name: ead-bpo-admin-web
    runtime: static
    rootDir: admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 🗄️ PostgreSQL Database
  - name: ead-bpo-db
    plan: free
    region: oregon
    databaseName: crm_gestores
    user: postgres
