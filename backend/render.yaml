services:
  - type: web
    name: ead-bpo-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ead-bpo-db
          property: connectionString

databases:
  - name: ead-bpo-db
    plan: free
    region: oregon
    databaseName: crm_gestores
    user: postgres
